<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <link rel="stylesheet" href="../css/style.css">
</head>

<body class="login-page">

  <div class="login-box">
    <h2>Login</h2>

    <form id="loginForm" autocomplete="off" onsubmit="event.preventDefault(); login();">
      <input type="text" id="username" name="username" autocomplete="new-username" placeholder="Username" autofocus />
      <input type="password" id="password" name="password" autocomplete="new-password" placeholder="Password" />
      <button type="submit">Login</button>
    </form>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
