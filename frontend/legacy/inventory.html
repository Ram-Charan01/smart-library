<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inventory</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <!-- 🔷 Navbar -->
  <nav class="navbar">
    <h1>📚 Smart Library (Admin)</h1>
    <div>
      <a href="admin.html">Home</a>
      <a href="inventory.html">Inventory</a>
      <a href="requests.html">Requests</a>
      <a href="#" id="authBtn"></a>
    </div>
  </nav>

  <section style="padding:20px;">
    <div style="display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;">
      <h2 style="margin:0;">📦 Inventory</h2>
      <button id="addBookBtn" class="action-btn" type="button" style="min-width:160px;">+ Add New Book</button>
    </div>
    <section class="search-section" style="margin-top:12px;">
      <input type="text" id="inventorySearch" placeholder="Search by title or author" />
    </section>
  </section>

  <section style="padding:20px;">
    <table class="book-table">
      <thead>
        <tr>
          <th>S.No</th>
          <th>Book Title</th>
          <th>Author</th>
          <th>Available Stock</th>
          <th>Edit</th>
        </tr>
      </thead>
      <tbody id="inventoryTable"></tbody>
    </table>
  </section>

  <section class="edit-modal hidden modal-overlay" id="editInventorySection">
    <div class="modal-content">
      <h3>Edit Book</h3>
      <form id="editInventoryForm">
        <input type="hidden" id="editBookId" />
        <div style="margin-bottom:8px;"><strong id="editBookInfo"></strong></div>
        <div style="margin-bottom:8px;">
          <label for="editBookImage">Update Image (optional): </label>
          <input type="file" id="editBookImage" accept="image/*" />
        </div>
        <div style="margin-bottom:8px;">
          <label for="editStock">Add Stock Count:</label>
          <input type="number" id="editStock" min="0" required />
        </div>
        <div style="display:flex; gap:8px; justify-content:flex-end;">
          <button class="action-btn" type="submit">Submit</button>
          <button class="reject-btn" id="cancelEdit" type="button">Cancel</button>
        </div>
      </form>
    </div>
  </section>

  <section class="add-modal hidden modal-overlay" id="addBookSection">
    <div class="modal-content">
      <h3>Add New Book</h3>
      <form id="addBookForm">
        <div>
          <label for="bookLookup">Search Open Library by title</label>
          <div class="book-lookup-controls">
            <input type="search" id="bookLookup" placeholder="Enter at least 3 characters" aria-describedby="bookLookupStatus" />
            <button class="action-btn" type="button" id="searchBookBtn">Search</button>
          </div>
          <small id="bookLookupStatus" role="status"></small>
        </div>
        <div>
          <label for="bookResults">Book title</label>
          <select id="bookResults" required>
            <option value="">Search to find a book</option>
          </select>
        </div>
        <div id="manualTitleField" hidden>
          <label for="newBookTitle">Manual book title</label>
          <input type="text" id="newBookTitle" disabled />
        </div>
        <div>
          <label for="newBookAuthor">Author:</label>
          <input type="text" id="newBookAuthor" required />
        </div>
        <div>
          <label for="newBookCategory">Category:</label>
          <select id="newBookCategory" required>
            <option value="">Select category</option>
            <option value="CE">CE</option>
            <option value="CSE">CSE</option>
            <option value="ECE">ECE</option>
            <option value="EEE">EEE</option>
            <option value="ME">ME</option>
            <option value="IT">IT</option>
            <option value="CSIT">CSIT</option>
            <option value="AIML">AIML</option>
            <option value="AIDS">AIDS</option>
            <option value="CSBS">CSBS</option>
            <option value="CIC">CIC</option>
            <option value="CSD">CSD</option>
          </select>
        </div>
        <div>
          <img id="bookCoverPreview" alt="Selected book cover" width="64" hidden />
          <label for="newBookImage">Upload a different cover (optional)</label>
          <input type="file" id="newBookImage" accept="image/jpeg,image/jpg,image/png" />
        </div>
        <div>
          <label for="newBookStock">Stock:</label>
          <input type="number" id="newBookStock" min="0" required />
        </div>
        <div style="display:flex; gap:8px; justify-content:flex-end;">
          <button class="action-btn" type="submit">Add Book</button>
          <button class="reject-btn" id="cancelAdd" type="button">Cancel</button>
        </div>
      </form>
    </div>
  </section>

  <script src="js/data.js"></script>
  <script src="js/inventory.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
