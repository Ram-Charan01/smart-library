<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Manage Requests</title>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>

  <!-- 🔷 Navbar -->
  <nav class="navbar">
    <h1>📚 Smart Library (Admin)</h1>
    <div>
      <a href="admin.html">Home</a>
      <a href="inventary.html">Inverntary</a>
      <a href="requests.html">Requests</a>
      <a href="#" id="authBtn"></a>
    </div>
  </nav>

  <!-- 📊 Title -->
  <section style="padding:20px;">
    <h2>📩 Manage Requests</h2>
    <div style="padding:8px 0;">
      <label for="requestSearch" style="font-weight:600; margin-right:8px;">Filter by User ID:</label>
      <input type="text" id="requestSearch" placeholder="Enter User ID" style="padding:6px 10px; border-radius:6px; border:1px solid #ccc; width:180px;" />
    </div>
  </section>

  <!-- 📋 Requests Table -->
  <section style="padding:20px;">
    <table class="book-table">
      <thead>
        <tr>
          <th>Book Name</th>
          <th>User ID</th>
          <th>Status</th>
          <th>Reserved Date</th>
          <th>Due Date</th>
          <th>Return Status</th>
          <th>Action</th>
        </tr>
      </thead>

      <tbody id="requestsTable">
        <!-- Filled by JS -->
      </tbody>
    </table>
  </section>

  <!-- JS -->
  <script src="js/data.js"></script>
  <script src="js/requests.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
